[workspace]
resolver = "3"
members = ["crates/settlement-core", "crates/settlement-cli", "src-tauri"]

# Canonical application version. See docs/VERSIONING.md.
[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
settlement-core = { path = "crates/settlement-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.10"
thiserror = "2"
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
# 2.12 is the newest updater that supports Tauri 2.11 (2.13 needs Tauri 2.12).
tauri-plugin-updater = "~2.12"
semver = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
